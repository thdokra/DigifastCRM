# Imagens de produção deste fork, no GHCR do dono.
#
# A VPS (OCI Ampere, `uname -m` = aarch64) não constrói: o `next build` do
# Dockerfile pede ~4 GB de heap. Quem constrói é este workflow, nas máquinas
# do GitHub. `docker-compose.prod.yml` já lê a referência do `.env`
# (`APP_IMAGE`, `WORKER_IMAGE`, `SCHEDULER_IMAGE`). Trocar de imagem é
# reescrever essas três linhas — o compose não muda.
#
# Arquitetura: os Dockerfiles não fixam plataforma. Cada arch compila no
# runner nativo (amd64 em `ubuntu-latest`, arm64 em `ubuntu-24.04-arm` — o
# repositório é público, então o runner ARM do GitHub existe). O job de baixo
# junta os dois digests num manifesto só, no mesmo desenho de
# `publish-image.yml` (`imagetools create` + `manifesto_tem_plataforma`).
# Sem QEMU.
#
# Tags finais (sem sufixo de arch):
#   :<sha completo>  imutável — a que a produção deve pinar (`pull_policy=missing`)
#   :latest          só no push (ou dispatch) da branch `main` — tag móvel
# O /api/v1/health da imagem lê APP_VERSION. Aqui ele vale `1.98.0+<sha>`:
# a base é a tag upstream, o sufixo é o commit deste fork. `package.json`
# continua `0.1.0`, igual à v1.98.0 — o produto não versiona por esse campo.
# As tags `-<arch>` ficam no registro como os digests que o manifesto cita.
#
# Não roda no upstream: o `if` do job exige este repositório. Lá quem publica
# continua sendo `publish-image.yml`.

name: Publicar imagens do fork (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publicar:
    if: github.repository == 'thdokra/DigifastCRM'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    concurrency:
      group: publicar-imagens-do-fork-${{ matrix.name }}-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # Publica no GHCR do dono do repositório. Sem este escopo o push é 403.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `name` e `arch` são os eixos. O `include` só completa o Dockerfile,
        # casando pelo `name` — o mesmo desenho de publish-image.yml. Sem os
        # dois eixos, um include seguinte sobrescreve o anterior.
        include:
          - name: deskcommcrm
            dockerfile: Dockerfile
          - name: deskcomm-worker
            dockerfile: Dockerfile.worker
          - name: deskcomm-scheduler
            dockerfile: Dockerfile.scheduler
        name: [deskcommcrm, deskcomm-worker, deskcomm-scheduler]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag desta arquitetura (sufixo -amd64 ou -arm64)
        id: tags
        env:
          NOME: ${{ matrix.name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${NOME}"
          lista="${img}:${SHA}-${ARCH}"
          if [ "$REF" = "refs/heads/main" ]; then
            lista="${lista}"$'\n'"${img}:latest-${ARCH}"
          fi
          {
            echo "list<<EOF"
            printf '%s\n' "$lista"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "imagem ${img} arch ${ARCH}"
          printf '%s\n' "$lista"

      - name: Build e push desta arquitetura (sem segredos)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            APP_VERSION=1.98.0+${{ github.sha }}
          cache-from: type=gha,scope=fork-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.name }}-${{ matrix.arch }}

  juntar:
    needs: [publicar]
    if: github.repository == 'thdokra/DigifastCRM'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publicar-imagens-do-fork-juntar-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Unir amd64 e arm64 em cada tag
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source hostgator-setup-kit/_manifestos.sh
          sufixos="$SHA"
          if [ "$REF" = "refs/heads/main" ]; then
            sufixos="${sufixos} latest"
          fi
          for nome in deskcommcrm deskcomm-worker deskcomm-scheduler; do
            img="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${nome}"
            for sufixo in $sufixos; do
              tag="${img}:${sufixo}"
              docker buildx imagetools create \
                --tag "$tag" \
                "${tag}-amd64" \
                "${tag}-arm64"
              manifesto_tem_plataforma "$tag" linux/amd64
              manifesto_tem_plataforma "$tag" linux/arm64
            done
          done
